name: ci
on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: pip install -e ".[service,mcp,otel,sentry,dev]" ruff
      - run: ruff check elastic_evals tests --select E,F,W,B --ignore E501,B008,E731,B905,B023
      # integration tests skip themselves when OpenSearch, Postgres, Kafka or the collector are absent
      - run: pytest -q

  go:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: collector } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.26", cache-dependency-path: collector/go.sum }
      - run: go vet ./... && go test ./...
      - run: test -z "$(gofmt -l processor exporter)"

  ui:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: ui } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: ui/package-lock.json }
      - run: npm ci && npm run build
