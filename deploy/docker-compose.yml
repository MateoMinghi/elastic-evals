# Development / single-host deployment of the whole stack.
#   docker compose -f deploy/docker-compose.yml up -d --build
#   agents send OTLP to localhost:4317 (gRPC) or localhost:4318 (HTTP) with resource attribute ee.tenant_id
#   UI and API: http://localhost:8000 (the setup job prints an admin API key: docker compose logs setup)
# Hosted evaluators (Jev, LLM judges) read OPENROUTER_API_KEY from deploy/.env; without it use local-only suites.
name: elastic-evals

x-ee: &ee
  image: ${EE_IMAGE:-elastic-evals:dev}
  build: { context: .., dockerfile: Dockerfile }
  env_file: [{ path: .env, required: false }]
  environment: &ee-env
    EE_POSTGRES_DSN: postgresql://ee:ee@postgres:5432/elastic_evals
    EE_OPENSEARCH_URL: http://opensearch:9200
    EE_KAFKA_BROKERS: kafka:9092
    EE_ARTIFACTS: file:///artifacts
  volumes: [artifacts:/artifacts]
  restart: unless-stopped

x-collector: &collector
  image: ${EE_COLLECTOR_IMAGE:-elastic-evals-collector:dev}
  build: { context: ../collector }
  volumes: [./collector:/etc/ee:ro]
  restart: unless-stopped

services:
  opensearch:
    image: ${OPENSEARCH_IMAGE:-opensearchproject/opensearch:3.9.0}
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"     # development only: enable the security plugin in production
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_JAVA_OPTS: -Xms1g -Xmx1g
      cluster.routing.allocation.disk.threshold_enabled: "false"
    ulimits: { memlock: { soft: -1, hard: -1 }, nofile: { soft: 65536, hard: 65536 } }
    volumes: [osdata:/usr/share/opensearch/data]
    ports: ["${EE_OPENSEARCH_PORT:-9200}:9200"]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf localhost:9200/_cluster/health || exit 1"]
      interval: 5s
      retries: 60

  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    environment: { POSTGRES_USER: ee, POSTGRES_PASSWORD: ee, POSTGRES_DB: elastic_evals }
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["${EE_POSTGRES_PORT:-5432}:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ee"]
      interval: 3s
      retries: 30

  kafka:
    image: ${KAFKA_IMAGE:-apache/kafka:4.1.0}
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 6
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      retries: 30

  dashboards:   # OpenSearch Dashboards with our saved objects: docker compose --profile dashboards up -d
    image: ${DASHBOARDS_IMAGE:-opensearchproject/opensearch-dashboards:3.9.0}
    profiles: [dashboards]
    environment:
      OPENSEARCH_HOSTS: '["http://opensearch:9200"]'
      DISABLE_SECURITY_DASHBOARDS_PLUGIN: "true"
    ports: ["${EE_DASHBOARDS_PORT:-5601}:5601"]
    depends_on: { opensearch: { condition: service_healthy } }

  setup:
    <<: *ee
    command: ["setup", "--tenant", "${EE_TENANT:-demo}", "--admin-key"]
    restart: "no"
    depends_on:
      opensearch: { condition: service_healthy }
      postgres: { condition: service_healthy }

  presidio:
    <<: *ee
    command: ["presidio", "--port", "3000"]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:3000/health')\""]
      interval: 5s
      retries: 60

  gateway:
    <<: *collector
    command: ["--config", "/etc/ee/gateway.yaml"]
    environment: { EE_KAFKA_BROKERS: "kafka:9092", EE_PRESIDIO_URL: "http://presidio:3000" }
    ports: ["${EE_OTLP_GRPC_PORT:-4317}:4317", "${EE_OTLP_HTTP_PORT:-4318}:4318"]
    depends_on:
      kafka: { condition: service_healthy }
      presidio: { condition: service_healthy }

  ingest:
    <<: *collector
    command: ["--config", "/etc/ee/ingest.yaml"]
    environment:
      EE_KAFKA_BROKERS: kafka:9092
      EE_OPENSEARCH_URL: http://opensearch:9200
      EE_PRICES_FILE: /etc/ee/prices.json
    depends_on:
      kafka: { condition: service_healthy }
      setup: { condition: service_completed_successfully }

  api:
    <<: *ee
    command: ["serve", "--port", "8000"]
    ports: ["${EE_API_PORT:-8000}:8000"]
    depends_on: { setup: { condition: service_completed_successfully } }

  tracker:
    <<: *ee
    command: ["tracker", "--brokers", "kafka:9092", "--session-idle", "${EE_SESSION_IDLE:-300}", "--trace-idle", "${EE_TRACE_IDLE:-30}"]
    depends_on:
      kafka: { condition: service_healthy }
      setup: { condition: service_completed_successfully }

  worker:
    <<: *ee
    command: ["worker"]
    deploy: { replicas: 1 }
    depends_on: { setup: { condition: service_completed_successfully } }

volumes:
  osdata:
  pgdata:
  artifacts:
